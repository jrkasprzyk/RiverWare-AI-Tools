name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Parser tests
        run: python -m unittest discover -s tests -v
      - name: MCP pure-function tests
        run: python -m unittest discover -s prototypes/riverware-mcp/tests -v

  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Private-reference scrub gate
        # Patterns and escape hatch live in the script so contributors can run
        # the identical check locally: sh scripts/scrub.sh
        run: sh scripts/scrub.sh
